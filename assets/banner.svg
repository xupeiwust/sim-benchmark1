<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" width="820" role="img" aria-label="sim-benchmark — industrial simulation agent benchmark">
  <title>sim-benchmark — industrial simulation agent benchmark</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="820" height="220" fill="url(#bg)"/>
  <rect width="820" height="220" fill="url(#grid)"/>

  <!-- decorative accent: residual-curve motif on the right -->
  <g transform="translate(560,40)" opacity="0.85">
    <polyline fill="none" stroke="url(#accent)" stroke-width="2"
      points="0,120 30,80 60,90 90,55 120,62 150,30 180,38 210,15 240,22"/>
    <circle cx="0"   cy="120" r="3" fill="#22d3ee"/>
    <circle cx="240" cy="22"  r="3" fill="#a78bfa"/>
    <text x="-4" y="140" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="end">residuals</text>
    <text x="245" y="22" fill="#94a3b8" font-family="monospace" font-size="10">converged</text>
  </g>

  <!-- title -->
  <g transform="translate(40,90)">
    <text font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="44" font-weight="700" fill="#f8fafc">
      sim-benchmark
    </text>
    <text x="0" y="34" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#94a3b8">
      Hand a real CAE/EDA task to an LLM agent. Score what it produced.
    </text>
    <text x="0" y="60" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#64748b">
      No LLM-as-judge · Source-provenance scoring · Oracle-verified tasks
    </text>
  </g>

  <!-- thin accent bar -->
  <rect x="40" y="180" width="180" height="3" fill="url(#accent)" rx="1.5"/>
</svg>
