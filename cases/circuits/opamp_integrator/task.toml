schema_version = "1.1"

[task]
name        = "sim-benchmark/opamp-integrator"
description = "Op-amp integrator with LT1001 — square-wave input produces triangular output; measure peak."
authors     = [{name = "sim-benchmark"}]
keywords    = ["circuit", "analog", "op-amp", "integrator"]

[environment]
docker_image    = "sim-benchmark-wine-base:latest"
cpus            = 2
memory_gb       = 2
internet_access = true

[agent]
timeout_s      = 1500
execution_user = "root"

[verifier]
timeout_s      = 120
execution_user = "root"

[metadata.sim]
solver          = "neutral"
source_type     = "vv_standard"
source_citation = "Sedra & Smith (2014). §2.5 — Miller integrator with op-amp; V_out = -(1/RC)·∫V_in dt."
source_url      = "https://global.oup.com/academic/product/microelectronic-circuits-9780199339136"
difficulty_tier = "M"
gt_type         = "high-fidelity-solver"
range_value     = 2.0
tags            = ["solver-neutral", "scalar-kpi", "transient", "spice", "op-amp", "integrator"]
release_status  = "public_runnable"
oracle_status   = "available"
score_template  = "measurement"
leakage_risk    = 2
capability_target = "postprocess"
