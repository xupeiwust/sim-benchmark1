schema_version = "1.1"

[task]
name        = "sim-benchmark/lc-lowpass-2nd"
description = "Second-order LC low-pass with source impedance — measure DC gain and -3 dB cutoff."
authors     = [{name = "sim-benchmark"}]
keywords    = ["circuit", "analog", "filter", "ac-analysis", "low-pass", "second-order"]

[environment]
docker_image    = "sim-benchmark-wine-base:latest"
cpus            = 2
memory_gb       = 2
internet_access = true

[agent]
timeout_s      = 1500
execution_user = "root"

[verifier]
timeout_s      = 120
execution_user = "root"

[metadata.sim]
solver          = "neutral"
source_type     = "vv_standard"
source_citation = "Sedra & Smith (2014). Microelectronic Circuits, 7th ed., §17.5 — second-order LC low-pass. f0 = 1/(2π√LC), Q determined by load and source impedance."
source_url      = "https://global.oup.com/academic/product/microelectronic-circuits-9780199339136"
difficulty_tier = "M"
gt_type         = "high-fidelity-solver"
range_value     = 5000.0
tags            = ["solver-neutral", "scalar-kpi", "ac-sweep", "spice", "second-order"]
release_status  = "public_runnable"
oracle_status   = "available"
score_template  = "measurement"
leakage_risk    = 2
capability_target = "postprocess"
