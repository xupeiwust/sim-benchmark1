schema_version = "1.1"

[task]
name        = "sim-benchmark/half-wave-rectifier"
description = "Single-diode half-wave rectifier with capacitor smoothing — DC output and ripple."
authors     = [{name = "sim-benchmark"}]
keywords    = ["circuit", "analog", "rectifier", "power-electronics"]

[environment]
docker_image    = "sim-benchmark-wine-base:latest"
cpus            = 2
memory_gb       = 2
internet_access = true

[agent]
timeout_s      = 1800
execution_user = "root"

[verifier]
timeout_s      = 120
execution_user = "root"

[metadata.sim]
solver          = "neutral"
source_type     = "vv_standard"
source_citation = "Mohan, Undeland, Robbins (2003). Power Electronics, Ch.5 — half-wave rectifier with cap smoothing. V_dc roughly equals V_pk minus diode drop, minus the C×R discharge during the no-conducting half."
source_url      = "https://www.wiley.com/en-us/Power+Electronics%3A+Converters%2C+Applications%2C+and+Design%2C+3rd+Edition-p-9780471226932"
difficulty_tier = "S"
gt_type         = "high-fidelity-solver"
range_value     = 12.0
tags            = ["solver-neutral", "scalar-kpi", "transient", "spice", "rectifier"]
release_status  = "public_runnable"
oracle_status   = "available"
score_template  = "measurement"
leakage_risk    = 2
capability_target = "postprocess"
