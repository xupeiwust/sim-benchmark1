schema_version = "1.1"

[task]
name        = "sim-benchmark/lc-resonator"
description = "Parallel LC tank — input current source, measure peak voltage and resonant frequency."
authors     = [{name = "sim-benchmark"}]
keywords    = ["circuit", "analog", "resonator", "ac-analysis", "tank"]

[environment]
docker_image    = "sim-benchmark-wine-base:latest"
cpus            = 2
memory_gb       = 2
internet_access = true

[agent]
timeout_s      = 1200
execution_user = "root"

[verifier]
timeout_s      = 120
execution_user = "root"

[metadata.sim]
solver          = "neutral"
source_type     = "vv_standard"
source_citation = "Sedra & Smith (2014). §17.4 — parallel LC tank, f0 = 1/(2π√LC); impedance peaks at f0 with Q determined by parallel resistance."
source_url      = "https://global.oup.com/academic/product/microelectronic-circuits-9780199339136"
difficulty_tier = "M"
gt_type         = "high-fidelity-solver"
range_value     = 5000.0
tags            = ["solver-neutral", "scalar-kpi", "ac-sweep", "spice"]
release_status  = "public_runnable"
oracle_status   = "available"
score_template  = "measurement"
leakage_risk    = 2
capability_target = "postprocess"
