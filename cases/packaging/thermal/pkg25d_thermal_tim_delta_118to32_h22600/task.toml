schema_version = "1.3"
artifacts = ["/tmp/agent/submission"]

[task]
name        = "sim-benchmark/pkg25d-thermal-tim-delta-118to32-h22600"
description = "2.5D accelerator package: how much peak ASIC temperature a TIM upgrade from 118 um / 4.7 to 32 um / 8.4 buys, at an unchanged 214 W load."
authors     = [{name = "sim-benchmark"}]
keywords    = ["packaging", "electronics-cooling", "calculix", "2.5d", "interposer", "hbm", "delta"]

[environment]
docker_image = "sim-benchmark-fem-fullstack:latest"
cpus         = 2
memory_mb    = 4096
storage_mb   = 4096
gpus         = 0
network_mode = "public"

[agent]
timeout_sec = 1800
user        = "agent"

[verifier]
timeout_sec      = 1340
user             = "agent"
environment_mode = "separate"

[verifier.environment]
cpus         = 2
memory_mb    = 4096
storage_mb   = 4096
gpus         = 0
network_mode = "public"

[metadata.sim]
task_id           = "pkg25d-thermal-tim-delta-118to32-h22600"
solver            = "calculix"
# Measured: TWO oracle solves at the reference grid on the domain image, one
# core. The scored quantity is their difference, so the case costs twice what
# an absolute member of this family does -- which is still 8 s.
oracle_wall_sec   = 8
source_type       = "novel_variant"
difficulty_tier   = "M"
gt_type           = "high-fidelity-solver"
release_status    = "public_runnable"
oracle_status     = "available"
runtime_status    = "oracle_calibrated_local_grid_study"
score_template    = "numerical"
leakage_risk      = 0
capability_target = "physics"
demand_record     = "docs/demand_sources/records/constructed/packaging/demand-packaging-tim-upgrade-delta-001.yaml"
source_citation   = """Vinci, 'Full-fidelity thermal simulation at floorplanning speed for 2.5D AI accelerator packages' -- the problem statement (logic ASIC and HBM stacks on a silicon interposer, TIM 25-150 um at 1-10 W/m/K, compute density past 1 W/mm^2, lateral coupling into the memory as the quantity of interest). The package here is a synthetic module built to that description; the reference value is this repository's own calibrated CalculiX oracle, not the vendor's."""
source_url        = "https://www.getvinci.ai/research/full-fidelity-thermal-simulation-at-floorplanning-speed-for-2-5d-ai-accelerator-packages/"
tags              = ["packaging", "numeric-kpi", "native-reproduction", "relation-kpi", "no-analytical-shortcut"]
