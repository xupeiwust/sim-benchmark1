schema_version = "1.1"

[task]
name        = "sim-benchmark/rlc-bandpass"
description = "Series RLC band-pass filter — measure resonant frequency and peak voltage gain via AC small-signal sweep."
authors     = [{name = "sim-benchmark"}]
keywords    = ["circuit", "analog", "filter", "ac-analysis", "band-pass"]

[environment]
docker_image    = "sim-benchmark-wine-base:latest"
cpus            = 2
memory_gb       = 2
internet_access = true

[agent]
timeout_s      = 1800
execution_user = "root"

[verifier]
timeout_s      = 120
execution_user = "root"

[metadata.sim]
solver          = "neutral"
source_type     = "vv_standard"
source_citation = "Sedra & Smith (2014). Microelectronic Circuits, 7th ed., §17.3 (passive RLC band-pass). Resonant frequency f0 = 1/(2π√LC); 3-dB bandwidth BW = R/(2πL); Q = (1/R)·√(L/C)."
source_url      = "https://global.oup.com/academic/product/microelectronic-circuits-9780199339136"
difficulty_tier = "S"
gt_type         = "high-fidelity-solver"
range_value     = 5000.0
tags            = ["solver-neutral", "scalar-kpi", "ac-sweep", "spice"]
release_status  = "public_runnable"
oracle_status   = "available"
score_template  = "measurement"
leakage_risk    = 2
capability_target = "postprocess"
