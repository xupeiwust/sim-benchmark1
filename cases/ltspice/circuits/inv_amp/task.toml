schema_version = "1.1"

[task]
name        = "sim-benchmark/inv-amp"
description = "Inverting op-amp amplifier with LT1001 — measure peak output amplitude and closed-loop gain."
authors     = [{name = "sim-benchmark"}]
keywords    = ["circuit", "analog", "op-amp", "amplifier", "active"]

[environment]
docker_image    = "sim-benchmark-wine-base:latest"
cpus            = 2
memory_gb       = 2
internet_access = true

[agent]
timeout_s      = 1500
execution_user = "root"

[verifier]
timeout_s      = 120
execution_user = "root"

[metadata.sim]
solver          = "neutral"
source_type     = "vv_standard"
source_citation = "Sedra & Smith (2014). Microelectronic Circuits, 7th ed., §2.2 (inverting amplifier). Closed-loop gain G = -R_feedback / R_in for ideal op-amp."
source_url      = "https://global.oup.com/academic/product/microelectronic-circuits-9780199339136"
difficulty_tier = "M"
gt_type         = "high-fidelity-solver"
range_value     = 1.0
tags            = ["solver-neutral", "scalar-kpi", "transient", "spice", "op-amp", "library"]
release_status  = "public_runnable"
oracle_status   = "available"
score_template  = "measurement"
leakage_risk    = 3
capability_target = "postprocess"
