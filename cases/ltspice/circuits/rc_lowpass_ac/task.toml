schema_version = "1.1"

[task]
name        = "sim-benchmark/rc-lowpass-ac"
description = "Loaded RC low-pass — sweep candidate capacitors and choose the smallest value that meets pass-band and attenuation specs."
authors     = [{name = "sim-benchmark"}]
keywords    = ["circuit", "analog", "filter", "ac-analysis", "low-pass"]

[environment]
docker_image    = "sim-benchmark-wine-base:latest"
cpus            = 2
memory_gb       = 2
internet_access = true

[agent]
timeout_s      = 1200
execution_user = "root"

[verifier]
timeout_s      = 120
execution_user = "root"

[metadata.sim]
solver          = "neutral"
source_type     = "novel_variant"
source_citation = "Sedra & Smith (2014). Microelectronic Circuits, 7th ed., §17.2 — first-order RC low-pass; loaded capacitor-selection variant generated with LTspice."
source_url      = "https://global.oup.com/academic/product/microelectronic-circuits-9780199339136"
difficulty_tier = "M"
gt_type         = "high-fidelity-solver"
range_value     = 1000.0
tags            = ["solver-neutral", "scalar-kpi", "ac-sweep", "spice", "first-order"]
release_status  = "public_runnable"
oracle_status   = "available"
score_template  = "measurement"
leakage_risk    = 1
capability_target = "physics"
