schema_version = "1.1"

[task]
name        = "sim-benchmark/rlc-step-underdamped"
description = "Underdamped second-order RLC step response — measure overshoot and settled value."
authors     = [{name = "sim-benchmark"}]
keywords    = ["circuit", "analog", "transient", "rlc", "second-order", "underdamped"]

[environment]
docker_image    = "sim-benchmark-wine-base:latest"
cpus            = 2
memory_gb       = 2
internet_access = true

[agent]
timeout_s      = 1500
execution_user = "root"

[verifier]
timeout_s      = 120
execution_user = "root"

[metadata.sim]
solver          = "neutral"
source_type     = "vv_standard"
source_citation = "Hayt et al. (2018). Ch.9 — second-order RLC step response. ω0=1/√LC, ζ=R/2·√(C/L); underdamped (ζ<1) shows overshoot."
source_url      = "https://www.mheducation.com/highered/product/engineering-circuit-analysis-hayt-kemmerly/M9780073545516.html"
difficulty_tier = "M"
gt_type         = "high-fidelity-solver"
range_value     = 1.0
tags            = ["solver-neutral", "scalar-kpi", "transient", "spice", "second-order"]
release_status  = "public_runnable"
oracle_status   = "available"
score_template  = "measurement"
leakage_risk    = 2
capability_target = "postprocess"
