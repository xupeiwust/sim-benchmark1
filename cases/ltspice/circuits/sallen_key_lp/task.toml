schema_version = "1.1"

[task]
name        = "sim-benchmark/sallen-key-lp"
description = "Sallen-Key second-order active low-pass filter — measure DC gain and -3 dB cutoff."
authors     = [{name = "sim-benchmark"}]
keywords    = ["circuit", "analog", "filter", "ac-analysis", "active", "op-amp"]

[environment]
docker_image    = "sim-benchmark-wine-base:latest"
cpus            = 2
memory_gb       = 2
internet_access = true

[agent]
timeout_s      = 1500
execution_user = "root"

[verifier]
timeout_s      = 120
execution_user = "root"

[metadata.sim]
solver          = "neutral"
source_type     = "vv_standard"
source_citation = "Sedra & Smith (2014). §17.6 — Sallen-Key low-pass. Cutoff f0 = 1/(2π√(R1·R2·C1·C2)); unity-gain follower configuration."
source_url      = "https://global.oup.com/academic/product/microelectronic-circuits-9780199339136"
difficulty_tier = "M"
gt_type         = "high-fidelity-solver"
range_value     = 1000.0
tags            = ["solver-neutral", "scalar-kpi", "ac-sweep", "spice", "active-filter", "op-amp"]
release_status  = "public_runnable"
oracle_status   = "available"
score_template  = "measurement"
leakage_risk    = 2
capability_target = "postprocess"
