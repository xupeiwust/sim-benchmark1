schema_version = "1.1"

[task]
name        = "sim-benchmark/dns-boxturb16"
description = "Decaying homogeneous isotropic turbulence in a periodic 16³ box, dnsFoam — TKE at t=10s"
authors     = [{name = "sim-benchmark"}]
keywords    = ["openfoam", "cfd", "dns", "turbulence", "transient", "3d", "incompressible"]

[environment]
cpus           = 2
memory_mb      = 4096
allow_internet = true

[agent]
timeout_sec = 1800
user        = "root"

[verifier]
timeout_sec = 120
user        = "root"

[metadata.sim]
solver          = "openfoam"
source_type     = "tutorial"
source_citation = "Adapted from ESI OpenFOAM v2412 tutorial DNS/dnsFoam/boxTurb16 (16³ periodic box, init turb via boxTurb utility, dnsFoam transient incompressible solver). Reference TKE computed by our oracle."
source_url      = "https://github.com/OpenFOAM/OpenFOAM-v2412/tree/master/tutorials/DNS/dnsFoam/boxTurb16"
difficulty_tier = "M"
gt_type         = "high-fidelity-solver"
tags            = ["transient", "turbulent", "3d", "dns", "decaying-turbulence"]

[[metadata.sim.kpis]]
name         = "mean_tke"
description  = "domain-averaged turbulent kinetic energy 0.5·<|u'|²> [m²/s²] at t=10 s (decayed state)"
gt_value     = 0.00908
gt_source    = "oracle-self-calibrated 2026-04-21; TKE = 0.009085 m²/s² at t=10s"
range_value  = 1.0
weight       = 1.0
