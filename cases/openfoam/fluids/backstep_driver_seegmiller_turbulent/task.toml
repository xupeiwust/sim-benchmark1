schema_version = "1.1"

[task]
name        = "sim-benchmark/backstep-driver-seegmiller-turbulent"
description = "2D backward-facing step, turbulent (Driver & Seegmiller 1985, M=0.128, Re_H~36000, expansion ratio 1.125). Reattachment, recirculation Cp, and downstream Cf-recovery vs experiment + NASA TMR validation case."
authors     = [{name = "sim-benchmark"}]
keywords    = ["cfd", "rans", "turbulent", "backstep", "separation", "reattachment", "2d", "vv"]

[environment]
docker_image    = "sim-benchmark-base:latest"
cpus            = 4
memory_gb       = 8
internet_access = true

[agent]
timeout_s      = 3600
execution_user = "root"

[verifier]
timeout_s      = 120
execution_user = "root"

[metadata.sim]
solver          = "neutral"
source_type     = "vv_standard"
source_citation = "NASA TMR 2D Backward Facing Step (Driver & Seegmiller 1985, AIAA J. 23(2), DOI:10.2514/3.8890). Experimental Cp, Cf, and reattachment data from TMR Backstep_validation files cp.expnew.dat (rev. 2014-02-28), cf.exp.dat (rev. 2015-10-17)."
source_url      = "https://turbmodels.larc.nasa.gov/backstep_val.html"
difficulty_tier = "M"
gt_type         = "experimental"
range_value     = 1.0
tags            = ["solver-neutral", "scalar-kpi", "separation", "reattachment", "wall-bounded", "no-analytical-shortcut"]
release_status  = "public_runnable"
oracle_status   = "available"
runtime_status  = "oracle_calibrated_local"
score_template  = "numerical"
leakage_risk    = 2
capability_target = "numerical"
