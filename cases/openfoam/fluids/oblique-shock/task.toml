schema_version = "1.1"

[task]
name        = "sim-benchmark/oblique-shock"
description = "2D oblique shock wave in normalized compressible flow, rhoCentralFoam (FoamBench basic/obliqueShock/1)"
authors     = [{name = "sim-benchmark"}]
keywords    = ["openfoam", "foambench", "compressible", "shock", "rhocentral", "2d", "transient"]

[environment]
cpus           = 2
memory_mb      = 4096
allow_internet = true

[agent]
timeout_sec = 1800
user        = "root"

[verifier]
timeout_sec = 120
user        = "root"

[metadata.sim]
solver          = "openfoam"
source_type     = "paper"
source_citation = "CFDLLMBench / NLR-Theseus FoamBench basic case 'obliqueShock/1'. 2D oblique shock, rhoCentralFoam, inlet U=2.9 m/s, T=1 K, p=1 Pa, normalized gas (R=0.7143, Cp=2.5, μ=0), end t=10 s. See https://github.com/NLR-Theseus/cfdllmbench"
source_url      = "https://www.kaggle.com/datasets/nithinsekhar/foambench/data"
difficulty_tier = "L"
gt_type         = "high-fidelity-solver"
tags            = ["foambench", "transient", "2d", "compressible", "shock", "supersonic"]

[[metadata.sim.kpis]]
name         = "max_p"
description  = "peak pressure p anywhere in the domain at t=10 s (final time) [Pa]; measures the pressure rise behind the oblique shock"
gt_value     = 4.499
gt_source    = "oracle-self-calibrated 2026-04-22 on openfoam10-paraview510:latest, max p=4.498790 Pa"
range_value  = 10.0
weight       = 0.6

[[metadata.sim.kpis]]
name         = "max_rho"
description  = "peak density ρ anywhere in the domain at t=10 s [normalized ρ]; measures the density jump across the shock"
gt_value     = 4.044
gt_source    = "oracle-self-calibrated 2026-04-22, max ρ=4.043550"
range_value  = 10.0
weight       = 0.4
