schema_version = "1.1"

[task]
name        = "sim-benchmark/cavity-re1000"
description = "Lid-driven cavity, Re=1000, 2D steady — centerline u-velocity at y=0.5 vs Ghia 1982"
authors     = [{name = "sim-benchmark"}]
keywords    = ["openfoam", "cfd", "laminar", "2d", "incompressible", "cavity"]

[environment]
cpus           = 2
memory_mb      = 4096
allow_internet = true

[agent]
timeout_sec = 1800
user        = "root"

[verifier]
timeout_sec = 120
user        = "root"

[metadata.sim]
solver          = "openfoam"
source_type     = "vv_standard"
source_citation = "Ghia, Ghia & Shin (1982) 'High-Re solutions for incompressible flow using the Navier-Stokes equations and a multigrid method', J. Comput. Phys. 48(3):387-411, Table I (Re=1000)"
source_url      = "https://doi.org/10.1016/0021-9991(82)90058-4"
difficulty_tier = "M"
gt_type         = "high-fidelity-solver"
tags            = ["steady", "laminar", "2D", "incompressible", "no-analytical-shortcut"]

[[metadata.sim.kpis]]
name         = "u_centerline"
description  = "streamwise velocity u_x at cavity center (x=0.05, y=0.05) [m/s], at steady state"
gt_value     = -0.06080
gt_source    = "Ghia, Ghia & Shin (1982) Table I Re=1000"
range_value  = 1.0
weight       = 1.0
