schema_version = "1.1"

[task]
name        = "sim-benchmark/hotroom-buoyant"
description = "Buoyant natural convection in a hot room (3D, k-epsilon RANS) — peak velocity magnitude in the buoyant plume"
authors     = [{name = "sim-benchmark"}]
keywords    = ["openfoam", "cfd", "buoyancy", "natural-convection", "3d", "rans", "k-epsilon", "heat-transfer"]

[environment]
cpus           = 2
memory_mb      = 4096
allow_internet = true

[agent]
timeout_sec = 1800
user        = "root"

[verifier]
timeout_sec = 120
user        = "root"

[metadata.sim]
solver          = "openfoam"
source_type     = "tutorial"
source_citation = "Adapted from ESI OpenFOAM v2412 tutorial heatTransfer/buoyantBoussinesqSimpleFoam/hotRoom (10×5×10 m room, 1×1 m hot floor patch at 600 K, ambient 300 K, k-epsilon RANS, gravity -y). Reference value computed by our own oracle (high-fidelity-solver GT)."
source_url      = "https://github.com/OpenFOAM/OpenFOAM-v2412/tree/master/tutorials/heatTransfer/buoyantBoussinesqSimpleFoam/hotRoom"
difficulty_tier = "M"
gt_type         = "high-fidelity-solver"
tags            = ["steady", "turbulent", "3d", "buoyancy", "rans", "k-epsilon"]

[[metadata.sim.kpis]]
name         = "max_U_magnitude"
description  = "maximum |U| anywhere in the domain [m/s], steady state (after at least 300 buoyantBoussinesqSimpleFoam iters)"
gt_value     = 0.182
gt_source    = "oracle-self-calibrated 2026-04-21; max |U| = 0.18204 m/s after 300 iters"
range_value  = 1.0
weight       = 1.0
