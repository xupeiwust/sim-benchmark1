schema_version = "1.1"

[task]
name        = "sim-benchmark/sandia-jet-variable-density"
description = "Sandia Schefer propane-air variable-density nonreacting nonpremixed turbulent jet (Re_D~68e3, U_jet=53 m/s). Centerline velocity + propane mass-fraction decay + jet half-width vs Schefer/Sandia experimental data."
authors     = [{name = "sim-benchmark"}]
keywords    = ["cfd", "rans", "turbulent", "jet", "species-transport", "variable-density", "nonpremixed", "axisymmetric", "vv"]

[environment]
docker_image    = "sim-benchmark-base:latest"
cpus            = 4
memory_gb       = 8
internet_access = true

[agent]
timeout_s      = 7200
execution_user = "root"

[verifier]
timeout_s      = 120
execution_user = "root"

[metadata.sim]
solver          = "neutral"
source_type     = "vv_standard"
source_citation = "Schefer et al. (Sandia, 1994 & 2003) propane-air variable-density turbulent jet experiment, distributed via the TNF Workshop archive (SANDC3H8.JET). Adopted as SU2 V&V case (https://su2code.github.io/vandv/SANDIA_jet/, rans/SANDIA_jet/VVSandiaJet.cfg)."
source_url      = "https://su2code.github.io/vandv/SANDIA_jet/"
difficulty_tier = "L"
gt_type         = "experimental"
range_value     = 53.0
tags            = ["solver-neutral", "scalar-kpi", "axisymmetric", "species-transport", "variable-density", "no-analytical-shortcut"]
release_status  = "public_runnable"
oracle_status   = "deferred"
score_template  = "numerical"
leakage_risk    = 1
capability_target = "numerical"
