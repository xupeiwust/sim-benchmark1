schema_version = "1.1"

[task]
name        = "sim-benchmark/naca0012-subsonic"
description = "NACA 0012 airfoil at M=0.15, Re=6e6, fully turbulent: CL/CD across alpha sweep, vs Ladson 1988 NASA TM-4074."
authors     = [{name = "sim-benchmark"}]
keywords    = ["cfd", "rans", "turbulent", "airfoil", "naca0012", "2d", "vv"]

[environment]
docker_image    = "sim-benchmark-base:latest"
cpus            = 4
memory_gb       = 8
internet_access = true

[agent]
timeout_s      = 5400
execution_user = "root"

[verifier]
timeout_s      = 120
execution_user = "root"

[metadata.sim]
solver          = "neutral"
source_type     = "vv_standard"
source_citation = "Ladson 1988 NASA TM-4074, transitioned at LE, Re=6e6, M=0.15. Cross-validated by NASA TMR's NACA0012 verification page."
source_url      = "https://tmbwg.github.io/turbmodels/naca0012_val.html"
difficulty_tier = "M"
gt_type         = "experimental"
range_value     = 1.0
tags            = ["solver-neutral", "scalar-kpi", "alpha-sweep", "turbulent-airfoil"]
release_status  = "public_runnable"
oracle_status   = "deferred"
score_template  = "numerical"
leakage_risk    = 2
capability_target = "numerical"
