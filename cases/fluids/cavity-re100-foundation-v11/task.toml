schema_version = "1.1"

[task]
name        = "sim-benchmark/cavity-re100-foundation-v11"
description = "Lid-driven cavity Re=100 on OpenFOAM Foundation v11 (foamRun/incompressibleFluid) — multi-version-fork demo"
authors     = [{name = "sim-benchmark"}]
keywords    = ["openfoam", "cfd", "laminar", "2d", "incompressible", "cavity", "foundation", "v11"]

[environment]
cpus           = 2
memory_mb      = 4096
allow_internet = true

[agent]
timeout_sec = 1800
user        = "root"

[verifier]
timeout_sec = 120
user        = "root"

[metadata.sim]
solver          = "openfoam"
source_type     = "vv_standard"
source_citation = "Same physical problem as cavity-re100 (Ghia, Ghia & Shin 1982 Table I, Re=100). Ported to OpenFOAM Foundation v11 (different fork from sim-benchmark's default ESI v2412): tutorial layout incompressibleFluid/cavity, foamRun unified solver, physicalProperties replaces transportProperties."
source_url      = "https://github.com/OpenFOAM/OpenFOAM-11/tree/master/tutorials/incompressibleFluid/cavity"
difficulty_tier = "S"
gt_type         = "high-fidelity-solver"
tags            = ["steady", "laminar", "2D", "incompressible", "no-analytical-shortcut", "foundation-fork"]

[[metadata.sim.kpis]]
name         = "u_centerline"
description  = "streamwise velocity u_x at cavity center (x=0.05, y=0.05) [m/s], at steady state"
gt_value     = -0.20581
gt_source    = "Ghia, Ghia & Shin (1982) Table I Re=100 (same physics as cavity-re100; Foundation-v11 port)"
range_value  = 1.0
weight       = 1.0
