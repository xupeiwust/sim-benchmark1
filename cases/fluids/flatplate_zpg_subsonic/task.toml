schema_version = "1.1"

[task]
name        = "sim-benchmark/flatplate-zpg-subsonic"
description = "2D turbulent zero-pressure-gradient flat plate, M=0.2, Re=5e6 per unit length; TMR 2DZP reference."
authors     = [{name = "sim-benchmark"}]
keywords    = ["cfd", "rans", "turbulent", "boundary-layer", "2d", "vv"]

[environment]
docker_image    = "sim-benchmark-base:latest"
cpus            = 4
memory_gb       = 8
internet_access = true

[agent]
timeout_s      = 3600
execution_user = "root"

[verifier]
timeout_s      = 120
execution_user = "root"

[metadata.sim]
solver          = "neutral"
source_type     = "vv_standard"
source_citation = "NASA Turbulence Modeling Resource — 2D Zero Pressure Gradient Flat Plate verification (SA / SST)"
source_url      = "https://tmbwg.github.io/turbmodels/flatplate.html"
difficulty_tier = "S"
gt_type         = "high-fidelity"
range_value     = 0.01
tags            = ["solver-neutral", "scalar-kpi", "pilot"]
release_status  = "public_runnable"
oracle_status   = "available"
score_template  = "numerical"
leakage_risk    = 2
capability_target = "numerical"
