schema_version = "1.1"

[task]
name        = "sim-benchmark/30p30n-three-element-highlift"
description = "30P30N three-element high-lift airfoil (JAXA APC-IV configuration F) at M=0.17, Re=1.71e6, alpha=5.5 deg, fully turbulent. CL/CD + slat suction-peak Cp vs SU2 V&V / JAXA APC-IV reference."
authors     = [{name = "sim-benchmark"}]
keywords    = ["cfd", "rans", "turbulent", "high-lift", "multi-element", "30p30n", "jaxa-apc", "2d", "vv"]

[environment]
docker_image    = "sim-benchmark-base:latest"
cpus            = 8
memory_gb       = 16
internet_access = true

[agent]
timeout_s      = 10800
execution_user = "root"

[verifier]
timeout_s      = 120
execution_user = "root"

[metadata.sim]
solver          = "neutral"
source_type     = "vv_standard"
source_citation = "JAXA Aerodynamics Prediction Challenge IV (APC-IV), 30P30N modified-slat configuration F. SU2 V&V case study (https://su2code.github.io/vandv/30p30n/) provides cross-code force coefficients (SA-neg / SST-2003m on L1-L5 meshes) and Cp distributions; underlying experimental data published as JAXA-SP-18-008 proceedings (2019). Mesh family L1-L5 bundled at /opt/vv/30p30n/ inside the container."
source_url      = "https://su2code.github.io/vandv/30p30n/"
difficulty_tier = "L"
gt_type         = "experimental"
range_value     = 3.0
tags            = ["solver-neutral", "scalar-kpi", "multi-element", "high-lift", "turbulent", "no-analytical-shortcut", "plot-derived-gt"]
release_status  = "public_runnable"
oracle_status   = "deferred"
score_template  = "numerical"
leakage_risk    = 1
capability_target = "numerical"
