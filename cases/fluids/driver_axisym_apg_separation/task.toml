schema_version = "1.1"

[task]
name        = "sim-benchmark/driver-axisym-apg-separation"
description = "Driver 1991 axisymmetric APG separated BL: cylinder + diverging fairing, M=0.088, separation+reattachment, vs experimental Cp/Cf."
authors     = [{name = "sim-benchmark"}]
keywords    = ["cfd", "rans", "turbulent", "separation", "axisymmetric", "apg", "vv"]

[environment]
docker_image    = "sim-benchmark-base:latest"
cpus            = 4
memory_gb       = 8
internet_access = true

[agent]
timeout_s      = 5400
execution_user = "root"

[verifier]
timeout_s      = 120
execution_user = "root"

[metadata.sim]
solver          = "neutral"
source_type     = "vv_standard"
source_citation = "Driver, D. M. (1991). 'Reynolds Shear Stress Measurements in a Separated Boundary Layer Flow.' AIAA Paper 91-1787. NASA TMR ASBL validation case."
source_url      = "https://tmbwg.github.io/turbmodels/driver_val.html"
difficulty_tier = "M"
gt_type         = "experimental"
range_value     = 0.5
tags            = ["solver-neutral", "scalar-kpi", "axisymmetric", "apg-separation"]
release_status  = "public_runnable"
oracle_status   = "deferred"
score_template  = "numerical"
leakage_risk    = 1
capability_target = "numerical"
