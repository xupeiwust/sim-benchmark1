schema_version = "1.1"

[task]
name        = "sim-benchmark/axibump-transonic"
description = "Bachalo & Johnson 1986 axisymmetric transonic bump (M=0.875, Re_c=2.763e6). Shock-induced separation; KPIs are shock location, post-shock Cp, separation/reattachment x/c vs TMR experimental + CFL3D-SA reference."
authors     = [{name = "sim-benchmark"}]
keywords    = ["cfd", "rans", "compressible", "transonic", "shock", "shock-induced-separation", "axisymmetric", "vv"]

[environment]
docker_image    = "sim-benchmark-base:latest"
cpus            = 4
memory_gb       = 8
internet_access = true

[agent]
timeout_s      = 5400
execution_user = "root"

[verifier]
timeout_s      = 120
execution_user = "root"

[metadata.sim]
solver          = "neutral"
source_type     = "vv_standard"
source_citation = "Bachalo, W. D., and Johnson, D. A. (1986). 'Transonic, Turbulent Boundary-Layer Separation Generated on an Axisymmetric Flow Model.' AIAA Journal, Vol. 24, No. 3, pp. 437-443. NASA Turbulence Modeling Resource Axisymmetric Transonic Bump validation case."
source_url      = "https://tmbwg.github.io/turbmodels/axibump_val.html"
difficulty_tier = "L"
gt_type         = "experimental"
range_value     = 1.0
tags            = ["solver-neutral", "scalar-kpi", "compressible", "transonic", "shock-induced-separation", "axisymmetric"]
release_status  = "public_runnable"
oracle_status   = "deferred"
score_template  = "numerical"
leakage_risk    = 1
capability_target = "numerical"
