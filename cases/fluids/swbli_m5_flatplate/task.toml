schema_version = "1.1"

[task]
name        = "sim-benchmark/swbli-m5-flatplate"
description = "Mach 5 impinging-shock / turbulent BL interaction (Schulein 1996, 10-deg wedge). Cf upstream/min/post-shock and separation bubble (x_sep, L_sep) vs SU2 V&V Schulein 2004 optical experimental dataset."
authors     = [{name = "sim-benchmark"}]
keywords    = ["cfd", "rans", "compressible", "hypersonic", "swbli", "shock-boundary-layer", "2d", "vv"]

[environment]
docker_image    = "sim-benchmark-base:latest"
cpus            = 4
memory_gb       = 8
internet_access = true

[agent]
timeout_s      = 5400
execution_user = "root"

[verifier]
timeout_s      = 120
execution_user = "root"

[metadata.sim]
solver          = "neutral"
source_type     = "vv_standard"
source_citation = "NPARC Alliance Mach 5 SWBLI; underlying experiment Schulein, Krogmann, Stanewsky, DLR IB 223-96 A 49 (1996), Schulein AIAA J 44(8) 2006. Reference values cross-validated against the SU2 V&V case study (Gomes, SU2 7.4.0)."
source_url      = "https://su2code.github.io/vandv/swbli/"
difficulty_tier = "L"
gt_type         = "experimental"
range_value     = 0.005
tags            = ["solver-neutral", "scalar-kpi", "compressible", "supersonic", "shock-induced-separation", "turbulent", "no-analytical-shortcut"]
release_status  = "public_runnable"
oracle_status   = "deferred"
score_template  = "numerical"
leakage_risk    = 1
capability_target = "numerical"
