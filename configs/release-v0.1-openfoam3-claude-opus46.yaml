# v0.1 OpenFOAM reference run: Claude Opus 4.6 on the 3 OpenFOAM cases
# that ship a no-token oracle (`solution/solve.sh`).
#
# Anthropic-protocol upstream via xaminim outside-platform gateway.
# Companion to release-v0.1-ltspice20-claude-opus46.yaml.

jobs_dir: jobs/release-v0.1-openfoam3-claude-opus46
n_concurrent_trials: 2
timeout_multiplier: 3.0

environment:
  type: docker
  delete: false

agents:
  - import_path: tools.agent_harness:ClaudeCodeAnthropicDirect
    model_name: claude-opus-4-6
    kwargs:
      max_turns: 300
    env:
      ANTHROPIC_API_KEY: '${OPUS46_AUTH_TOKEN}'
      ANTHROPIC_BASE_URL: '${OPUS46_BASE_URL}'
      ANTHROPIC_CUSTOM_HEADERS: "X-Session-Id: sim-benchmark-v0.1\nX-Sub-Module: claude-code-internal"
      CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: '1'

datasets:
  - path: cases/fluids
    task_names:
      - flatplate_zpg_subsonic
      - lid_driven_cavity_re100
      - lid_driven_cavity_re1000
