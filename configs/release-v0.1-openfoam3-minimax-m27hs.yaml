# v0.1 OpenFOAM reference run: MiniMax-M2.7-highspeed on the 3 OpenFOAM cases
# that have a no-token oracle (`solution/solve.sh`) shipped today.
#
# Companion to release-v0.1-ltspice20-minimax-m27hs.yaml — same model,
# smaller scope. M2.7-highspeed is the non-reasoning fast variant; expect
# wall time on par with M2.5-highspeed, NOT the ~78min/case that the May 6
# M2.7-reasoning OpenFOAM runs took.
#
# Requires line 7 of E:\simcli\sim-benchmark\API in MINIMAX_API_KEY (line 8
# does not support M2.7-highspeed).

jobs_dir: jobs/release-v0.1-openfoam3-minimax-m27hs
n_concurrent_trials: 3
timeout_multiplier: 3.0

environment:
  type: docker
  delete: false

agents:
  - import_path: tools.agent_harness:ClaudeCodeViaCcr
    model_name: MiniMax-M2.7-highspeed
    kwargs:
      max_turns: 300
    env:
      ANTHROPIC_API_KEY: 'harbor-ccr-2026'
      ANTHROPIC_BASE_URL: 'http://127.0.0.1:3456'
      CCR_UPSTREAM_BASE: 'https://api.minimaxi.com/v1/chat/completions'
      CCR_UPSTREAM_KEY: '${MINIMAX_API_KEY}'

datasets:
  - path: cases/fluids
    task_names:
      - flatplate_zpg_subsonic
      - lid_driven_cavity_re100
      - lid_driven_cavity_re1000
