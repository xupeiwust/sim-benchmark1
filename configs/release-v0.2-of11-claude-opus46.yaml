# v0.2 OpenFOAM expanded run: Claude Opus 4.6 on the 11 newly-calibrated OF cases.
# Requires OPUS46_AUTH_TOKEN + OPUS46_BASE_URL env vars at launch.

jobs_dir: jobs/release-v0.2-of11-claude-opus46
n_concurrent_trials: 2
timeout_multiplier: 3.0

environment:
  type: docker
  delete: false

agents:
  - import_path: tools.agent_harness:ClaudeCodeAnthropicDirect
    model_name: claude-opus-4-6
    kwargs:
      max_turns: 300
    env:
      ANTHROPIC_API_KEY: '${OPUS46_AUTH_TOKEN}'
      ANTHROPIC_BASE_URL: '${OPUS46_BASE_URL}'
      ANTHROPIC_CUSTOM_HEADERS: "X-Session-Id: sim-benchmark-v0.2\nX-Sub-Module: claude-code-internal"
      CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: '1'

datasets:
  - path: cases/fluids
    task_names:
      - bernard-cells-3d
      - cavity-re100-foundation-v11
      - cylinder-nonnewtonian
      - dambreak-multiphase
      - dns-boxturb16
      - hotroom-buoyant
      - lid-driven-cavity-re100
      - lid-driven-cavity-re1000
      - lid-driven-cavity-re400
      - oblique-shock
      - pitzdaily-bfs-rans
