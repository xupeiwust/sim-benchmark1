# v0.1 MVP reference run: MiniMax-M2.7 on all 20 LTspice circuit tasks.
#
# This is a release-facing model run config, not an ablation. It uses the
# full LTspice image because v0.1 evaluates task solving and artifact
# provenance, not whether a model discovers a particular tool layer.

jobs_dir: jobs/release-v0.1-ltspice20-minimax-m27
n_concurrent_trials: 3
timeout_multiplier: 3.0

environment:
  type: docker
  delete: false

agents:
  - import_path: tools.agent_harness:ClaudeCodeViaCcr
    model_name: MiniMax-M2.7
    kwargs:
      max_turns: 300
    env:
      ANTHROPIC_API_KEY: 'harbor-ccr-2026'
      ANTHROPIC_BASE_URL: 'http://127.0.0.1:3456'
      CCR_UPSTREAM_BASE: 'https://api.minimaxi.com/v1/chat/completions'
      CCR_UPSTREAM_KEY: '${MINIMAX_API_KEY}'

datasets:
  - path: cases/circuits
    task_names:
      - bridge_rectifier_ripple
      - diff_amp
      - half_wave_rectifier
      - inv_amp
      - lc_lowpass_2nd
      - lc_resonator
      - noninv_amp
      - opamp_buffer
      - opamp_integrator
      - opamp_summer
      - rc_highpass_ac
      - rc_lowpass_ac
      - rc_pulse_response
      - rl_lowpass_ac
      - rl_step
      - rlc_bandpass
      - rlc_notch
      - rlc_step_overdamped
      - rlc_step_underdamped
      - sallen_key_lp
