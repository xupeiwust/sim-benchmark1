# Publish the case images `REPRODUCING.md` Path A tells a reader to pull.
#
# Naming: ghcr.io/svd-ai-lab/sim-benchmark/<domain>-<subdomain>-<case-id>:<tag>
#   (the case path with '/' replaced by '-'), tagged `env-<git tree sha of the
#   case's environment/>` and `latest`.
#
# BASE_REGISTRY is overridden to docker.io for CI (GitHub runners reach
# Docker Hub fine). Our local CN dev still uses docker.1panel.live via
# cases/*/environment/docker-compose.yaml.
#
# ---------------------------------------------------------------------------
# Why the matrix is a registry diff and not a `find` (#124)
#
# The old `detect` job ran `find cases -type d -name environment` and fed every
# hit to the matrix, unconditionally, on every run. Three faults, and
# `-path 'cases/*/*/environment'` hid all of them: `-path` globs match `/` too,
# so a pattern written for a three-level layout silently matched the four- and
# five-level ones as well.
#
#   * 121 jobs per run. Actions meters per job, rounded up to a whole minute,
#     so ~20 s of work per job was billed 121 minutes. The four August 2026 runs
#     came to 456 of this repository's 1074 metered minutes -- not the 3% the
#     issue first estimated, nor the 12% the follow-up estimated from a job list
#     that `gh api` had truncated at its default page size of 30.
#   * Every one of those builds was red, and had been since at least
#     2026-04-27. 100 of the 121 directories are under cases/_pending/,
#     cases/_phase2/ and cases/_deferred/ and build `FROM` images that exist on
#     no registry; the other 21 have no Dockerfile at all, because in this repo
#     an `environment/` directory usually holds the fixtures Harbor uploads into
#     the agent's working directory rather than a build context.
#   * So the workflow published nothing while costing more than the case gate.
#
# The repair is not "diff what the push touched". That narrows the matrix and
# buys a worse failure: an image that should have been pushed and was not.
# `github.event.before` is all zeroes on a branch's first push and stale after a
# force-push, and an empty diff is indistinguishable from "nothing to do" --
# which is exactly the silence this workflow cannot afford, since the next
# symptom is a trial pulling a digest older than the case.
#
# Instead: `plan` asks the registry which required images are absent and emits
# only those; `verify` re-asks after the builds and fails the run if any is
# still missing. Stateless and idempotent -- a cancelled run, a failed build, a
# tag deleted by hand and a push that never happened all leave the same
# observable, and the next run repairs it. `verify` has to be its own job
# because a build that succeeds while pushing somewhere else would otherwise
# loop forever without ever going red.
#
# Steady state is two jobs -- two billable minutes -- and today the required set
# is empty, because no live-track case ships an `environment/Dockerfile`.
# The reasoning, and the one input a content tag cannot see (a base image moving
# under a floating `FROM`, which is what `workflow_dispatch` force=true is for),
# is in `.github/case_images.py`.
#
# `case_images.py` is stdlib-only on purpose: these two jobs skip the uv setup
# step the case gate needs, so a reconcile costs a checkout and nothing else.
# ---------------------------------------------------------------------------

name: Build and push case images

on:
  push:
    branches: [main]
    paths:
      # Live-track cases only. `*` does not match `/` in a path filter, so the
      # first line is exactly cases/<domain>/<subdomain>/<case-id>/environment/**
      # -- most staging trees sit a level deeper and stop matching. The
      # exception is `cases/_pending/<subdomain>/<case>/`, which happens to have
      # the same depth as a live case and triggered the 2026-08-01 run all by
      # itself; the negation (a later pattern wins) takes those out too.
      - 'cases/*/*/*/environment/**'
      - '!cases/_*/**'
      - '.github/workflows/push-case-images.yaml'
      - '.github/case_images.py'
  # A push only reconciles what a push touched. An image that was never built at
  # all, or one whose tag was deleted by hand, is invisible to every trigger
  # above -- so ask once a week regardless. Two jobs.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild every required image even if the registry already has it'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

# A reconciler must not race itself: two runs would both see the same image
# missing and both build it. Serialise rather than cancel -- a cancelled run is
# a half-finished push, and while the next run repairs it, paying for the same
# build twice is the thing this file exists to stop.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: svd-ai-lab/sim-benchmark

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - name: Which required images does the registry lack
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            python3 .github/case_images.py plan --force
          else
            python3 .github/case_images.py plan
          fi

  build:
    name: Build ${{ matrix.image.case }}
    needs: plan
    if: ${{ needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout sim-benchmark
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged by content, not by commit. `:${{ github.sha }}` moved on every
      # commit, so "does the registry already have this build?" had no answer --
      # which is what made rebuilding everything look like the only option.
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: cases/${{ matrix.image.case }}/environment
          build-args: |
            BASE_REGISTRY=docker.io
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image.slug }}:${{ matrix.image.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image.slug }}:latest
          push: true
          cache-from: type=gha,scope=${{ matrix.image.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.slug }}

  # The whole point. Without this an image that never landed is a silence; with
  # it, it is a red run on main. Runs whether `build` was skipped (nothing was
  # missing) or failed (something is missing and stayed missing).
  verify:
    name: Every required image is in the registry
    needs: [plan, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Re-ask the registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: python3 .github/case_images.py verify
